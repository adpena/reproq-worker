name: Go CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Database integration uses make test-integration locally with a Django-prepared DB.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: go mod download

    - name: Install configured linter
      run: |
        make lint-install
        echo "$PWD/.local/bin" >> "$GITHUB_PATH"

    - name: Unit tests, vet and lint
      run: make check
