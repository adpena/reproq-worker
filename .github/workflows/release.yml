name: Release Worker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching the worker Version constant
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: worker-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Reject any existing release
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo "A release already exists for $RELEASE_TAG; it will not be changed." >&2
            exit 1
          fi
      - name: Build canonical candidates
        run: scripts/build_releases.sh --tag "$RELEASE_TAG" --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: worker-release-candidates
          path: dist/release/*
          if-no-files-found: error
      - name: Verify final bytes and create an unpublished draft
        shell: bash
        run: |
          (cd dist/release && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "$RELEASE_TAG" --generate-notes
